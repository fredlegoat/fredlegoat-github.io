<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridgredle | Bridgerton Edition</title>
    <link rel="icon" type="image/x-icon" href="gallery/bridger.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --gold: #b9935a;
            --gold-light: #e5c185;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --success: #1db954;
            --danger: #e74c3c;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* Custom Text Selection */
        ::selection {
            background: rgba(185, 147, 90, 0.4);
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(185, 147, 90, 0.5);
        }

        ::-moz-selection {
            background: rgba(185, 147, 90, 0.4);
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(185, 147, 90, 0.5);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(185, 147, 90, 0.4) 0%, rgba(185, 147, 90, 0.2) 40%, rgba(185, 147, 90, 0.08) 70%);
            padding: clamp(1rem, 3vw, 3rem) clamp(0.5rem, 2vw, 3rem);
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.75rem;
            }
        }

        h1,
        .serif {
            font-family: 'Playfair Display', serif;
        }

        .gold-gradient {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* Game Specific Style Override */
        .cell {
            transform: translateY(20px);
            opacity: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            transition: all 0.3s var(--ease-out-expo);
            min-height: clamp(2.5rem, 8vw, 4rem);
            height: clamp(2.5rem, 8vw, 4rem);
            overflow: hidden;
            hyphens: none;
            line-height: 1.1;
            padding: clamp(0.25rem, 1vw, 1rem);
            font-size: clamp(7px, 1.8vw, 14px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-wrap: break-word;
        }

        @media (max-width: 640px) {
            .cell {
                min-height: 2.5rem;
                height: 2.5rem;
                padding: 0.25rem;
                font-size: 7px;
                line-height: 1;
                border-radius: 6px;
            }
        }

        @media (min-width: 641px) and (max-width: 768px) {
            .cell {
                min-height: 3rem;
                height: 3rem;
                padding: 0.5rem;
                font-size: 9px;
                border-radius: 8px;
            }
        }

        @media (min-width: 769px) {
            .cell {
                min-height: 4rem;
                height: 4rem;
                padding: 1rem;
                font-size: 14px;
                border-radius: 10px;
            }
        }

        .cell.correct {
            background: linear-gradient(135deg, rgba(185, 147, 90, 0.6) 0%, rgba(185, 147, 90, 0.4) 100%) !important;
            color: white !important;
            border: 1px solid rgba(185, 147, 90, 0.8) !important;
            box-shadow: 0 0 20px rgba(185, 147, 90, 0.2);
        }

        .cell.wrong {
            background: rgba(255, 255, 255, 0.03) !important;
            color: rgba(255, 255, 255, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.03) !important;
        }

        #char-input {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            color: white;
            transition: all 0.3s ease;
            font-size: clamp(1rem, 3vw, 1.5rem);
            padding: clamp(0.75rem, 2vw, 1.25rem) clamp(1rem, 3vw, 2rem);
        }

        @media (max-width: 768px) {
            #char-input {
                font-size: 1rem;
                padding: 0.875rem 1rem;
            }
        }

        #char-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(185, 147, 90, 0.15);
        }

        #autocomplete-list {
            background: #0a0a0a;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            margin-top: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            max-height: 280px;
            /* Limit height to force scroll */
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            z-index: 1000;
            position: relative;
        }

        /* Supprimer tout effet de fade/gradient sur la liste */
        #autocomplete-list::before,
        #autocomplete-list::after {
            display: none !important;
        }

        .autocomplete-item img {
            border: 1px solid rgba(185, 147, 90, 0.2);
            padding: 2px;
            background: rgba(255, 255, 255, 0.05);
        }

        .autocomplete-item {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            text-decoration: none !important;
            opacity: 1 !important; /* Force l'opacité à 1 */
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: rgba(255, 255, 255, 0.1) !important;
            border-bottom-color: transparent;
        }

        .autocomplete-item span {
            text-decoration: none !important;
            display: block;
            opacity: 1 !important; /* Force l'opacité à 1 */
        }

        .success-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .success-overlay .glass-card {
            padding: clamp(2rem, 5vw, 3rem);
            max-width: min(90vw, 42rem);
            width: 100%;
        }

        .success-overlay h2 {
            font-size: clamp(2rem, 6vw, 3.75rem);
        }

        .success-overlay .relative {
            width: clamp(120px, 25vw, 192px);
            height: clamp(120px, 25vw, 192px);
        }

        @media (max-width: 768px) {
            .success-overlay .glass-card {
                padding: 2rem 1.5rem;
            }
            
            .success-overlay h2 {
                font-size: 2rem;
                margin-bottom: 1.5rem;
            }
            
            .success-overlay p {
                font-size: 1rem;
                margin-bottom: 2rem;
            }
            
            .success-overlay #secret-name {
                font-size: 1.75rem;
            }
            
            .success-overlay .flex {
                flex-direction: column;
                width: 100%;
            }
            
            .success-overlay button {
                width: 100%;
                max-width: 300px;
                padding: 1rem 2rem;
            }
        }

        .back-btn {
            position: fixed;
            top: clamp(15px, 3vw, 25px);
            left: clamp(15px, 3vw, 25px);
            z-index: 100;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            border-radius: 50px;
            font-size: clamp(11px, 2vw, 13px);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 10px);
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 10px;
                left: 10px;
                padding: 8px 14px;
                font-size: 10px;
                gap: 6px;
            }
            
            .back-btn svg {
                width: 12px;
                height: 12px;
            }
        }

        .back-btn:hover {
            background: white;
            color: black;
            border-color: white;
            transform: translateY(-2px);
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: fixed;
            top: clamp(15px, 3vw, 20px);
            right: clamp(15px, 3vw, 20px);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: clamp(8px, 2vw, 12px);
            color: white;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(36px, 8vw, 44px);
            height: clamp(36px, 8vw, 44px);
        }

        @media (max-width: 768px) {
            .fullscreen-btn {
                top: 10px;
                right: 10px;
                width: 36px;
                height: 36px;
                padding: 8px;
            }
            
            .fullscreen-btn svg {
                width: 16px;
                height: 16px;
            }
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* Retro effects - pixel grid and vignette */
        .pixel-grid {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.03));
            background-size: 3px 3px, 3px 3px;
            opacity: 0.7;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Autocomplete optimizations */
        #autocomplete-list {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #autocomplete-list::-webkit-scrollbar {
            display: none;
        }

        /* Site-wide Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, transparent, var(--gold), transparent);
            border-radius: 10px;
        }

        /* Chat Assistant Styles - Exact copy from main site */
        .chat-assistant {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            pointer-events: none;
            animation: chatFloat 4s ease-in-out infinite;
        }

        .chat-icon {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.2));
            animation: chatGlow 3s ease-in-out infinite;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
            -webkit-user-drag: none;
        }

        .chat-icon:hover {
            transform: scale(1.05);
        }

        .chat-bubble {
            max-width: 180px;
            word-wrap: break-word;
            line-height: 18px;
            position: relative;
            padding: 7px 12px;
            border-radius: 18px;
            border-bottom-left-radius: 2px;
            background: #3a3a3c;
            color: white;
            opacity: 0;
            transform-origin: bottom left;
            transform: translateX(-15px) translateY(-40px) scale(0.4);
            pointer-events: all;
        }

        .chat-bubble::before {
            content: "";
            position: absolute;
            bottom: 0px;
            left: -6px;
            width: 8px;
            height: 10px;
            background-color: #3a3a3c;
            -webkit-mask: radial-gradient(circle at top left, transparent 8px, black 8.5px) left top / 100% 100% no-repeat;
            mask: radial-gradient(circle at top left, transparent 8px, black 8.5px) left top / 100% 100% no-repeat;
        }

        .chat-bubble p {
            margin: 0;
            color: white;
            font-size: 0.75rem;
            line-height: 1.3;
            font-family: "Helvetica Neue", Helvetica, sans-serif;
            font-weight: normal;
        }

        @keyframes bubblePop {
            to {
                opacity: 1;
                transform: translateX(-15px) translateY(-60px) scale(1);
            }
        }

        @keyframes bubblePopOut {
            0% {
                opacity: 1;
                transform: translateX(-15px) translateY(-60px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateX(-15px) translateY(-40px) scale(0.4);
            }
        }

        @keyframes chatGlow {

            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.2));
            }

            50% {
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.25));
            }
        }

        @keyframes chatFloat {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 768px) {
            .chat-assistant {
                bottom: 20px;
                left: 20px;
            }

            .chat-icon {
                width: 50px;
                height: 50px;
            }

            .chat-bubble {
                max-width: 140px;
                padding: 6px 10px;
            }

            .chat-bubble p {
                font-size: 0.7rem;
            }
        }

        /* Headers of the grid */
        .headers-label {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            opacity: 0.4;
            font-size: clamp(7px, 1.5vw, 10px);
        }

        @media (max-width: 768px) {
            .headers-label {
                font-size: 7px;
                letter-spacing: 0.5px;
                gap: 0.25rem;
            }
        }

        #hint-message {
            font-size: clamp(10px, 2vw, 14px);
            padding: clamp(1rem, 3vw, 1.5rem);
        }

        @media (max-width: 768px) {
            #hint-message {
                padding: 1rem;
                margin-bottom: 1.5rem;
            }
            
            #hint-message p {
                font-size: 10px;
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Custom Cursor - only on devices with fine pointer (mouse) */
        .c-cursor {
            display: none;
        }

        .js-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
        }

        @media (any-pointer: fine) {
            * {
                cursor: none !important;
            }
            
            .c-cursor {
                display: block;
            }
            
            .c-cursor__inner {
                pointer-events: none;
                position: fixed;
                top: 0;
                left: 0;
                mix-blend-mode: difference;
                border-radius: 50%;
                z-index: 99999;
            }
            
            .c-cursor__inner--circle {
                width: 20px;
                height: 20px;
                border: 1px solid #fff;
                transition: transform 0.05s ease-out;
            }
        }
    </style>
</head>

<body class="p-4 md:p-12">
    <!-- Custom Cursor -->
    <div class="js-cursor">
        <div class="c-cursor__inner c-cursor__inner--circle js-cursor-inner">
            <div class="c-cursor__side c-cursor__side--left js-cursor-right"></div>
            <div class="c-cursor__side c-cursor__side--right js-cursor-left"></div>
        </div>
    </div>

    <!-- Ambient Smoke Canvas -->
    <div id="canvas-container"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000;">
        <canvas id="smokeCanvas" style="position: absolute; top:0; left:0; width:100%; height:100%;"></canvas>
        <div class="pixel-grid"></div>
        <div class="vignette"></div>
    </div>

    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        RETOUR
    </a>

    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Plein Écran">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
        </svg>
    </button>

    <header class="text-center mb-16 header-anim" style="margin-bottom: clamp(2rem, 5vw, 4rem); margin-top: clamp(3rem, 8vw, 0);">
        <p class="italic text-[10px] uppercase font-bold tracking-[0.3em] text-gray-500 mb-3 font-mono" style="font-size: clamp(8px, 1.5vw, 10px);">
            La Chronique des Bridgerton
        </p>
        <h1 class="text-5xl md:text-7xl font-bold mb-6 gold-gradient pb-2 italic" style="font-size: clamp(2rem, 8vw, 4.5rem); margin-bottom: clamp(1rem, 3vw, 1.5rem);">Bridgerdle</h1>
        <div class="w-16 h-0.5 bg-gradient-to-r from-transparent via-[#b9935a] to-transparent mx-auto opacity-40"></div>
    </header>

    <div class="max-w-5xl mx-auto" style="padding: 0 clamp(0.5rem, 2vw, 1rem);">
        <div class="relative mb-16" style="margin-bottom: clamp(2rem, 5vw, 4rem);">
            <input type="text" id="char-input" autocomplete="off" placeholder="Quel membre de la noblesse cherches-tu ?"
                class="w-full py-5 px-8 text-2xl italic focus:outline-none transition-all shadow-xl">
            <div id="autocomplete-list" class="absolute left-0 right-0 z-50"></div>
        </div>

        <div id="hint-message" class="text-center mb-8 p-6 glass-card border-dashed">
            <p
                class="text-xs md:text-sm text-[#b9935a] uppercase font-bold tracking-widest flex items-center justify-center gap-3">
                <span class="w-2 h-2 rounded-full bg-[#b9935a] animate-pulse"></span>
                Les colonnes "Famille" et "Statut" seront révélées après 3 essais

        </div>

        <div
            class="grid grid-cols-8 gap-1 md:gap-3 mb-6 text-[8px] md:text-[10px] uppercase font-bold headers-label px-2 text-center" style="gap: clamp(0.125rem, 0.5vw, 0.75rem); margin-bottom: clamp(1rem, 3vw, 1.5rem); padding: 0 clamp(0.25rem, 1vw, 0.5rem);">
            <div>Personnage</div>
            <div>Famille</div>
            <div>Sexe</div>
            <div>Rang</div>
            <div>Statut</div>
            <div>Classe</div>
            <div>Rôle</div>

        <div id="guesses-container" class="space-y-6 mb-32" style="margin-bottom: clamp(6rem, 15vw, 8rem);"></div>

    <div id="success-modal" class="success-overlay p-8 text-center">
        <div class="glass-card p-12 max-w-2xl border-2 border-[#b9935a]/30">
            <p class="gold-gradient text-sm font-mono tracking-[0.5em] mb-4 font-bold uppercase">Affaire Classée</p>
            <h2 class="text-5xl md:text-6xl gold-gradient mb-8 serif italic">Le mystère est résolu</h2>
            <div class="relative w-40 h-40 md:w-48 md:h-48 mx-auto mb-8">
                <div class="absolute inset-0 rounded-full border-2 border-[#b9935a] animate-ping opacity-20"></div>
                <img id="secret-image" src="" alt=""
                    class="w-full h-full rounded-full object-cover shadow-2xl border-4 border-[#b9935a]">
            </div>
            <p class="text-xl mb-12 text-gray-400 font-light">C'était bel et bien<br>
                <span id="secret-name"
                    class="font-bold text-white text-3xl md:text-4xl block mt-2 tracking-wide"></span>
            </p>
            <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <button id="btn-review"
                    class="px-12 py-4 bg-transparent border border-[#b9935a] text-[#b9935a] rounded-full hover:bg-[#b9935a] hover:text-white transition-all transform hover:scale-105 uppercase tracking-widest text-[10px] font-bold">
                    Revoir mes tentatives
                </button>
                <button id="btn-replay"
                    class="px-12 py-4 bg-[#b9935a] text-white rounded-full hover:bg-white hover:text-black transition-all transform hover:scale-105 shadow-xl uppercase tracking-widest text-[10px] font-bold">
                    Nouvelle Partie
                </button>
            </div>
        </div>
    </div>

    <script src="smoke_bg.js"></script>
    <script src="bridgedle.js"></script>
    <script>
        // Simple chat logic for Bridgerdle - exact copy from main site
        document.addEventListener('DOMContentLoaded', () => {
            const chatIcon = document.querySelector('.chat-icon');
            const chatBubble = document.querySelector('.chat-bubble');

            if (chatIcon && chatBubble) {
                chatIcon.addEventListener('click', () => {
                    // Reset animation
                    chatBubble.style.animation = 'none';
                    void chatBubble.offsetWidth; // Force reflow
                    chatBubble.style.animation = 'bubblePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';

                    // Auto hide after 5 seconds
                    if (chatBubble.hideTimeout) clearTimeout(chatBubble.hideTimeout);
                    chatBubble.hideTimeout = setTimeout(() => {
                        chatBubble.style.animation = 'none';
                        void chatBubble.offsetWidth;
                        chatBubble.style.animation = 'bubblePopOut 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) forwards';
                    }, 5000);
                });
            }
        });

        // Custom Cursor - from do-or-die
        const body = document.body;

        const MathUtils = {
            lineEq: (y2, y1, x2, x1, currentVal) => {
                const m = (y2 - y1) / (x2 - x1);
                const b = y1 - m * x1;
                return m * currentVal + b;
            },
            lerp: (a, b, n) => (1 - n) * a + n * b,
            getRandomFloat: (min, max) => (Math.random() * (max - min) + min).toFixed(2)
        };

        const getMousePos = e => {
            if (!e) e = window.event;
            // Utiliser clientX/clientY car le cursor est en position fixed
            return { 
                x: e.clientX || 0, 
                y: e.clientY || 0 
            };
        };

        let winsize;
        const calcWinsize = () => (winsize = { width: window.innerWidth, height: window.innerHeight });
        calcWinsize();
        window.addEventListener("resize", calcWinsize);

        let mousepos = { x: winsize.width / 2, y: winsize.height / 2 };
        window.addEventListener("mousemove", ev => (mousepos = getMousePos(ev)));

        // Custom cursor class
        class Cursor {
            constructor(el) {
                this.DOM = { el: el };
                this.DOM.circle = this.DOM.el.querySelector(".js-cursor-inner");
                this.bounds = this.DOM.circle.getBoundingClientRect();
                this.lastMousePos = { x: 0, y: 0 };
                this.scale = 1;
                this.lastScale = 1;
                requestAnimationFrame(() => this.render());
            }

            render() {
                this.lastMousePos.x = MathUtils.lerp(
                    this.lastMousePos.x,
                    mousepos.x - this.bounds.width / 2,
                    0.6
                );
                this.lastMousePos.y = MathUtils.lerp(
                    this.lastMousePos.y,
                    mousepos.y - this.bounds.height / 2,
                    0.6
                );
                this.lastScale = MathUtils.lerp(this.lastScale, this.scale, 0.5);
                this.DOM.circle.style.transform = `translateX(${this.lastMousePos.x}px) translateY(${this.lastMousePos.y}px) scale(${this.lastScale})`;
                requestAnimationFrame(() => this.render());
            }

            enter() {
                this.scale = 1.5;
            }

            leave() {
                this.scale = 1;
            }

            click() {
                this.lastScale = 0.4;
            }
        }

        // Initialize custom cursor
        const cursorEl = document.querySelector(".js-cursor");
        if (cursorEl) {
            const cursor = new Cursor(cursorEl);

            // Add hover effects to interactive elements
            const interactiveElements = document.querySelectorAll('button, a, input, .chat-icon');
            interactiveElements.forEach(element => {
                element.addEventListener('mouseenter', () => cursor.enter());
                element.addEventListener('mouseleave', () => cursor.leave());
                element.addEventListener('click', () => cursor.click());
            });
        }

        // Fullscreen toggle function
        function toggleFullscreen() {
            const elem = document.documentElement;

            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log(err));
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>

        <img src="gallery/chat_6.png" alt="Assistant" class="chat-icon" draggable="false">
        <div class="chat-bubble">
            <p>Tema comment je suis habillé et tu veux que je t'aide en plus ? 😭😭</p>
        </div>
    </div>
